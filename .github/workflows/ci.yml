name: Full-stack verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: urfa
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: urfa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U urfa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:api
        env:
          TEST_DATABASE_URL: postgresql://urfa:test-only-password@localhost:5432/urfa_test
      - run: npm run build:server
