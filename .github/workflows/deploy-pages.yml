name: Remove stale GitHub Pages workflow

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - name: No-op
        run: echo "This workflow is no longer used. The active Pages deploy workflow is .github/workflows/pages.yml."